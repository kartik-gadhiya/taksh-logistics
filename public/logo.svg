<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Red gradient for EDTS text & arrow -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    
    <!-- Metallic Charcoal Gray Gradient for Road & Text -->
    <linearGradient id="grayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B7280" />
      <stop offset="50%" stop-color="#4B5563" />
      <stop offset="100%" stop-color="#374151" />
    </linearGradient>

    <!-- Dark Metal for Road Base -->
    <linearGradient id="darkGray" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>
  </defs>

  <!-- Group centered -->
  <g transform="translate(0, 0)">
    <!-- Road Curves -->
    <!-- Left outer curve road -->
    <path d="M 60 310 C 60 210, 160 160, 310 160 L 305 175 C 175 175, 90 220, 90 310 Z" fill="url(#darkGray)" />
    
    <!-- Red dashed lane line on road -->
    <path d="M 125 310 C 125 240, 185 188, 290 178" fill="none" stroke="#DC2626" stroke-width="10" stroke-dasharray="16, 12" stroke-linecap="butt" />

    <!-- Right inner curve road -->
    <path d="M 170 310 C 170 250, 210 200, 295 190 L 290 202 C 220 212, 190 255, 190 310 Z" fill="url(#grayGradient)" />

    <!-- Red Location Pin Marker -->
    <g transform="translate(255, 110)">
      <path d="M 22 0 C 9.95 0, 0 9.95, 0 22 C 0 38.5, 22 60, 22 60 C 22 60, 44 38.5, 44 22 C 44 9.95, 34.05 0, 22 0 Z" fill="url(#redGradient)" />
      <circle cx="22" cy="20" r="8" fill="#FFFFFF" />
    </g>

    <!-- EDTS Main Text Group -->
    <g transform="translate(270, 150)">
      <!-- Speed Motion Lines behind E -->
      <path d="M 0 35 L 50 35 L 45 42 L -5 42 Z" fill="url(#grayGradient)" opacity="0.8" />
      <path d="M -15 62 L 65 62 L 60 69 L -20 69 Z" fill="url(#grayGradient)" opacity="0.8" />
      
      <!-- 'E' In Metallic Gray -->
      <path d="M 45 35 L 125 35 L 120 48 L 65 48 L 60 62 L 110 62 L 105 75 L 55 75 L 48 95 L 115 95 L 110 108 L 30 108 Z" fill="url(#grayGradient)" />

      <!-- 'D' In Metallic Gray -->
      <path d="M 120 35 L 175 35 C 205 35, 215 50, 210 75 C 205 100, 185 108, 155 108 L 105 108 Z M 140 48 L 130 95 L 155 95 C 172 95, 184 90, 188 75 C 192 60, 182 48, 165 48 Z" fill="url(#grayGradient)" />

      <!-- 'T' In Crimson Red -->
      <path d="M 195 35 L 275 35 L 270 48 L 240 48 L 222 108 L 198 108 L 216 48 L 190 48 Z" fill="url(#redGradient)" />

      <!-- 'S' In Crimson Red -->
      <path d="M 290 35 L 355 35 L 350 48 L 308 48 L 302 64 L 345 66 C 362 67, 368 78, 363 93 C 358 107, 342 108, 320 108 L 260 108 L 265 95 L 320 95 C 330 95, 338 94, 340 86 C 342 78, 335 77, 325 76 L 285 74 C 270 73, 265 62, 270 48 C 275 37, 285 35, 290 35 Z" fill="url(#redGradient)" />

      <!-- Fast Arrow Indicator (Gray & Red) -->
      <path d="M 370 35 L 420 72 L 350 115 L 365 115 L 435 72 L 385 35 Z" fill="url(#grayGradient)" />
      <path d="M 395 50 L 425 72 L 385 100 L 398 100 L 438 72 L 408 50 Z" fill="url(#redGradient)" />

      <!-- Bottom Red Accent Line -->
      <path d="M 0 118 L 385 118 L 380 122 L 0 122 Z" fill="url(#redGradient)" />
    </g>

    <!-- Tagline: Lifted with Care, Delivered with Trust. -->
    <text x="500" y="305" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="28" font-weight="700" font-style="italic" fill="#1F2937" text-anchor="middle" letter-spacing="-0.5">
      Lifted with Care, Delivered with Trust.
    </text>
  </g>
</svg>
